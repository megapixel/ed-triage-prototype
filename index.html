<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Triage Prototype</title>
<style>
:root{
  --bg:#e9ebee; --ink:#1b1d20; --mute:#777; --line:#eaeaea; --soft:#f6f7f7; --hi:#777; --dark:#1f2328;
  --p1:#d93636; --p2:#ee8a1c; --p3:#e4be1f; --p4:#3aa655; --ok:#2e8b57; --err:#c0392b; --blue:#2b6cb0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0 8px 0 0}
.seg{display:inline-flex;border:1px solid #ccc;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px}
.seg button.on{background:var(--dark);color:#fff}
.top .sp{flex:1}
.top .lnk{background:none;border:1px solid #ccc;border-radius:8px;padding:6px 12px;color:#444}
.stage{display:flex;justify-content:center;padding:20px 12px 40px}
.device{background:#fff;border:10px solid #111;border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.device.phone{width:390px;height:780px;max-width:100%}
.device.tablet{width:860px;height:640px;max-width:100%}
@media (max-width:520px){.device{border-width:0;border-radius:0;height:calc(100vh - 110px)!important}.stage{padding:0}}
.nav{background:var(--dark);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;min-height:50px;flex:none}
.nav h2{font-size:17px;margin:0;flex:1;font-weight:600}
.nav .back{background:none;border:0;color:#fff;font-size:20px;padding:0 6px}
.nav .act{background:none;border:0;color:#fff;font-size:14px;padding:4px 6px;opacity:.9}
.body{flex:1;overflow:auto;padding:16px}
.foot{padding:12px 16px;border-top:1px solid var(--line);flex:none;background:#fff}
.tabbar{display:flex;border-top:1px solid var(--line);flex:none;background:#fff}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 8px;color:#999;font-size:12px}
.tabbar button b{display:block;font-size:19px;line-height:1.1;font-weight:400}
.tabbar button.on{color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;background:var(--dark);color:#fff;font-weight:600;font-size:15px}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.gap{margin-top:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.card.tap{cursor:pointer}
.card.tap:hover{background:var(--soft)}
label.f{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1px solid #d6d6d6;border-radius:10px;font:inherit;background:#fff}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:#555}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;color:#000}
.chip.on{background:var(--hi);color:#fff;border-color:var(--hi)}
.chip:disabled{background:#eee;color:#ccc;cursor:not-allowed}
.chip.p1.on{background:var(--p1);border-color:var(--p1)}.chip.p2.on{background:var(--p2);border-color:var(--p2)}
.chip.p3.on{background:var(--p3);border-color:var(--p3);color:#222}.chip.p4.on{background:var(--p4);border-color:var(--p4)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-size:15px}
.av.lg{width:64px;height:64px;font-size:22px}
.name{font-weight:600}
.sub{color:var(--mute);font-size:13px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:var(--soft);border:1px solid var(--line);color:#444}
.pill.s1{background:#fff4e0;border-color:#f3d9a4}.pill.s2{background:#e6f0fb;border-color:#b9d4f1}.pill.s3{background:#e5f5ea;border-color:#b6dec3}
.pri{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;color:#fff}
.pri.p1{background:var(--p1)}.pri.p2{background:var(--p2)}.pri.p3{background:var(--p3);color:#222}.pri.p4{background:var(--p4)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--dark);color:#fff;flex:none}
.stats div{padding:8px 4px 10px;text-align:center;border-bottom:3px solid transparent;color:#bbb;cursor:default}
.stats.click div{cursor:pointer}
.stats div.on{color:#fff;border-bottom-color:#fff}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px}
.hdr{display:flex;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase}
.sec-t{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.q{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.q .t{flex:1}
.q button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 16px}
.q button.on{background:var(--hi);color:#fff}
.steps{display:flex;gap:4px;padding:10px 16px 0}
.steps i{flex:1;height:4px;border-radius:2px;background:#ddd}
.steps i.on{background:var(--dark)}
.center{text-align:center}
.big{font-size:26px;font-weight:700}
.cam{height:280px;border-radius:14px;background:#2a2d31;display:flex;align-items:center;justify-content:center;color:#aaa;position:relative;overflow:hidden}
.cam .sil{width:120px;height:150px;border:3px dashed #666;border-radius:60px 60px 40px 40px}
.cam .shot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#3b4048;color:#fff;font-size:15px;flex-direction:column;gap:8px}
.bars{height:3px;background:#444;position:absolute;left:0;right:0;top:0;animation:scan 2s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.toast{position:absolute;left:12px;right:12px;top:12px;padding:12px 14px;border-radius:10px;color:#fff;background:var(--err);z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:in .2s}
.toast.ok{background:var(--ok)}
@keyframes in{from{transform:translateY(-14px);opacity:0}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:15}
.modal .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:80%;overflow:auto}
.modal.mid{align-items:center;justify-content:center;padding:20px}.modal.mid .sheet{border-radius:16px}
.search{padding:8px 12px;background:var(--dark);flex:none}
.search input{background:#fff}
.map{width:100%;border:1px solid var(--line);border-radius:12px;background:#fafafa}
.room{cursor:pointer}.room rect{fill:#f1f2f4;stroke:#aaa}.room.on rect{fill:#dfe9f7;stroke:var(--blue);stroke-width:2}
.room text{font-size:11px;fill:#333;pointer-events:none}
.dot{fill:var(--blue)}.dotn{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}
.new{display:inline-block;background:var(--p1);color:#fff;font-size:10px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.bubble{background:var(--soft);border-radius:12px;padding:8px 12px;margin:6px 0;max-width:85%}
.bubble.me{background:#e6f0fb;margin-left:auto}
.hint{font-size:12px;color:var(--mute)}
.note{font-size:12px;background:#fffbe6;border:1px solid #f1e4a3;border-radius:8px;padding:8px 10px;margin-top:12px;color:#665}
.sw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw button{flex:1;border:0;background:#eee;padding:10px}
.sw button.on{background:#000;color:#fff}
.pen{color:var(--blue);font-size:13px;background:none;border:0;padding:0}

.tabs{display:flex;overflow-x:auto;background:var(--dark);flex:none}
.tabs button{flex:none;background:none;border:0;color:#aaa;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.mini{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--dark);color:#fff;flex:none}
.mini .sub{color:#bbb}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;background:var(--dark);flex:none}
.carousel .c{flex:none;text-align:center;color:#bbb;font-size:12px;cursor:pointer;width:64px}
.carousel .c.on{color:#fff}
.carousel .av{margin:0 auto 4px;outline:2px solid transparent;outline-offset:2px}
.carousel .c.on .av{outline-color:#fff}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc .h{display:flex;align-items:center;gap:8px;padding:12px}
.acc .h .t{flex:1;font-weight:600}
.acc .b{padding:0 12px 12px;border-top:1px solid var(--line);padding-top:10px;white-space:pre-wrap}
.tl{position:relative;padding-left:16px;border-left:2px solid var(--line);margin-left:6px}
.tl .card{position:relative}
.tl .card:before{content:"";position:absolute;left:-24px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--hi)}
.tile b{font-size:26px;display:block}
.bubble .t{font-size:11px;color:var(--mute)}
.rec{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.rec.on{background:#e6f0fb;border-color:#b9d4f1}
.menu{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="top">
  <h1>ED Triage &amp; Consultation — prototype</h1>
  <div class="seg" id="appSwitch">
    <button data-app="patient">Patient kiosk (iPad)</button>
    <button data-app="doctor">Doctor app (iPhone)</button>
  </div>
  <label class="hint"><input type="checkbox" id="assisted"> Assisted flow (adds area allocation + QR link to a doctor, as on iPhone)</label>
  <span class="sp"></span>
  <button class="lnk" id="resetBtn">Reset mock data</button>
</div>
<div class="stage"><div id="device" class="device"></div></div>

<script>

const now = Date.now(), min = 60000;

}

// mirrors Utility.getDurationText (simplified: largest exact unit)
function durText(sec){
  if(!sec) return 'N/A';
  const u=[['years',31536000],['months',2592000],['weeks',604800],['days',86400],['hours',3600],['minutes',60],['seconds',1]];
  for(const [n,s] of u){ if(sec>=s && sec%s===0) return `${sec/s} ${n}`; }
  for(const [n,s] of u){ if(sec>=s) return `${Math.floor(sec/s)} ${n}`; }
  return 'N/A';
}

function stats(list){
  const pending=list.filter(p=>p.visit&&p.visit.status===1), prog=list.filter(p=>p.visit&&p.visit.status===2), seen=list.filter(p=>p.visit&&p.visit.status===3);
  const wait = pending.length? Math.round(Math.max(...pending.map(p=>(Date.now()-p.visit.arrived)/min))):0;

}

function createVisit(){
  let p = patientByNric(P.nric);
  const prof=P.prof;
  const addr=[prof.address,prof.address2].filter(Boolean).join('\n');
  if(!p){
    p={nric:P.nric,first:prof.first,last:prof.last,gender:LOOKUP.genders.find(g=>g.name===prof.gender).id,dob:prof.dob,pob:prof.pob,address:addr,allergies:'',visit:null};
    DB.patients.push(p);
  } else {
    Object.assign(p,{first:prof.first,last:prof.last,gender:LOOKUP.genders.find(g=>g.name===prof.gender).id,dob:prof.dob,pob:prof.pob,address:addr});
  }
  const [s,d]=(P.vitals.bp.split('/').map(x=>parseInt(x,10)||0));
  p.prior=p.prior||[];
  if(p.visit){ p.prior.unshift({doctor:p.visit.attending,hospital:'City General Hospital',area:areaName(p.visit.triage&&p.visit.triage.area),status:statusName(p.visit.status),diagnosis:p.visit.diagnosis?p.visit.diagnosis.text:'',created:p.visit.arrived}); }
  p.visit={id:DB.nextVisit++,status:1,notes:{mode:'Walk-in',referredBy:'Self',complaints:'',comments:''},consult:{history:'',exam:'',plan:''},arrived:Date.now(),room:2,trolley:P.trolley,qa:Object.assign({},P.answers),
    vitals:{temp:parseFloat(P.vitals.temp)||0,bpS:s||0,bpD:d||0,hr:parseInt(P.vitals.hr)||0,pain:parseInt(P.vitals.pain)||0,rr:parseInt(P.vitals.rr)||0,o2:parseInt(P.vitals.o2)||0},
    triage:null,diagnosis:null,tasks:[],attending:null,qr:null};
  if(P.area){ p.visit.triage={complaint:null,priority:null,area:P.area,dur:0,comment:'',mode:'Walk-in',flags:''}; }
  P.visitId=p.visit.id; save();
}
const pBack={face:'welcome',scan:'face',profile:'scan',questions:'profile',vitals:'questions',allocation:'vitals',qr:'allocation'};
function patientAction(a,el){
  switch(a){
  case 'p-start': P.step='face'; break;
  case 'p-back': { let t=pBack[P.step]; if(P.step==='qr'&&!assisted()) t='vitals'; P.step=t||'welcome'; break; }
  case 'p-photo': P.photo = el.textContent.trim()!=='Retake'; break;
  case 'p-face-next': if(!P.photo) return toast('Patient Photo is missing!'); P.step='scan'; break;
  case 'p-scan-existing': { const p=DB.patients[Math.floor(Math.random()*DB.patients.length)]; P.nric=p.nric; P.scanned=true; break; }
  case 'p-scan-new': P.nric='S'+Math.floor(1000000+Math.random()*8999999)+'Z'; P.scanned=true; break;
  case 'p-scan-manual': { const v=$('#nricIn').value.trim(); if(!v) return toast('Please scan your ID!'); P.nric=v; P.scanned=true; break; }
  case 'p-scan-next': {
    if(!P.scanned||!P.nric) return toast('Please scan your ID!');
    const p=patientByNric(P.nric);
    P.existing=!!p; P.editing=false;
    if(p){ P.nric=p.nric; const ad=p.address.split('\n'); P.prof={first:p.first,last:p.last,gender:genderName(p),dob:p.dob,pob:p.pob,address:ad[0]||'',address2:ad[1]||''}; }
    else P.prof={first:'',last:'',gender:'',dob:'',pob:'',address:'',address2:''};
    P.step='profile'; break; }
  case 'p-edit': P.editing=true; break;
  case 'p-profile-next': {
    const x=P.prof;
    if(!x.first) return toast('First name is missing!'); if(!x.last) return toast('Last name is missing!');
    if(!x.dob) return toast('Date of birth is missing!'); if(!x.gender) return toast('Gender is missing!');
    if(!x.pob) return toast('Place of birth is missing!'); if(!x.address) return toast('Address is missing!');
    P.step='questions'; break; }
  case 'p-ans': { const q=+el.dataset.q, v=+el.dataset.v; if(P.answers[q]===v) delete P.answers[q]; else P.answers[q]=v; break; }
  case 'p-trolley': P.trolley=!P.trolley; break;
  case 'p-q-next': if(Object.keys(P.answers).length!==LOOKUP.questions.length) return toast('You need to give answer of all questions!'); P.step='vitals'; break;
  case 'p-getvitals': P.vitals={temp:(36.4+Math.random()*2).toFixed(1),bp:`${110+Math.floor(Math.random()*40)}/${70+Math.floor(Math.random()*25)}`,hr:String(68+Math.floor(Math.random()*40)),pain:String(Math.floor(Math.random()*8)),rr:String(14+Math.floor(Math.random()*8)),o2:String(94+Math.floor(Math.random()*6))}; break;
  case 'p-vitals-next': {
    const v=P.vitals; if(Object.values(v).some(x=>String(x).trim()==='')) return toast('Please fill in all vital signs!');
    if(assisted()){ P.step='allocation'; } else { createVisit(); P.step='qr'; }
    break; }
  case 'p-area': P.area=+el.dataset.id; break;
  case 'p-alloc-next': if(!P.area) return toast('Please select an area!'); createVisit(); P.step='qr'; break;
  case 'p-qr-scan': P.scanned=true; { const p=patientByNric(P.nric); if(p&&p.visit){ p.visit.qr='QR-'+Math.random().toString(36).slice(2,8).toUpperCase(); p.visit.attending=1; p.visit.status=1; save(); } } break;
  case 'p-done': toast('Registration complete',true); resetPatient(); break;
  }
  renderPatient();
}

      ${DB.teams.map(tm=>{ const mem=DB.doctors.filter(d=>d.team===tm.id); const docs=mem.filter(d=>d.type!==3).length; const can=docs<4;
        return `<button class="chip" style="width:100%;margin-bottom:10px;text-align:left;padding:16px;${can?'':'opacity:.5'}" ${can?'':'disabled'} data-a="d-jointeam" data-id="${tm.id}"><b>Team ${esc(tm.name)}</b><br><span class="sub">${mem.length} members${can?'':' · full (4 doctors)'}</span></button>`; }).join('')}
      <div class="hint">Teams are capped at 4 doctors (<code>can_join</code>).</div></div>`;
    break;
  case 'assign': h=renderAssign(cur()); break;
  case 'newteam':
    h=`${nav('Create team',{back:'d-back'})}<div class="body"><label class="f">Team name</label><input type="text" id="tn" placeholder="e.g. Paediatrics" value="${esc(D.reg.teamName||'')}">
      <label class="f">Area of coverage</label><div class="chips">${LOOKUP.doctorAreas.map(a=>`<button class="chip ${D.reg.teamArea===a.id?'on':''}" data-a="d-teamarea" data-id="${a.id}">${a.name}</button>`).join('')}</div></div>
      <div class="foot"><button class="btn" data-a="d-createteam">Create</button></div>`;
    break;
  case 'main': h=renderMain(); break;
  case 'detail': h=renderDetail(t); break;
  case 'triage': h=renderTriage(t); break;
  case 'dispose': h=renderDispose(t); break;
  case 'tasks': h=renderTasks(t); break;
  case 'newtask': h=renderTaskNew(t); break;
  case 'mtriage': h=renderMoreTriage(t); break;
  case 'screening': h=renderScreening(); break;
  case 'analytics': h=renderAnalytics(); break;
  case 'shell': h=`${nav(esc(t.title),{back:'d-back'})}<div class="body"><div class="empty">This screen is an empty shell in the source app (just a title and a back button).</div></div>`; break;
  case 'task': h=renderTask(t); break;
  }
  dev.innerHTML=h;
}

function doctorTabs(){

}
function renderMain(){
  let body='';

    const all=allPatientsForView(); const st=stats(all);

    const order={1:0,2:1,3:2}; list.sort((a,b)=>order[a.visit.status]-order[b.visit.status]||(a.visit.triage&&a.visit.triage.priority||9)-(b.visit.triage&&b.visit.triage.priority||9));

  } else if(D.tab==='team'){

      <div class="body">${D.seg===3
        ? mem.map(d=>`<div class="card"><div class="hdr">${avatar({first:d.first,last:d.last})}<div><div class="name">${esc(d.title)} ${esc(d.first)} ${esc(d.last)}</div><div class="sub">${find(LOOKUP.doctorTypes,d.type).name} · ${esc(d.role)}</div><div class="sub">${find(LOOKUP.doctorAreas,d.area).name} · shift ${esc(d.shift)}</div></div></div></div>`).join('')
        : (list.length?list.map(p=>patientRow(p)).join(''):'<div class="empty">No patients</div>')}</div>`;
  } else if(D.tab==='map'){
    body=renderMap();
  } else if(D.tab==='more'){
    body=renderMore();

    body=`${nav('Notice board')}<div class="body">${DB.board.slice().sort((a,b)=>b.created-a.created).map(b=>{
      const open=D.boardOpen===b.id;

        <div style="margin-top:6px;${open?'':'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden'}">${esc(b.text)}</div>

function renderMap(){
  const pos={1:[20,20,150,90],2:[190,20,150,90],3:[20,130,100,100],4:[135,130,100,100],5:[250,130,90,100],6:[20,245,320,60]};

  const sel=D.roomSel;
  const svg=`<svg class="map" viewBox="0 0 360 325">${LOOKUP.rooms.map(r=>{const [x,y,w,h]=pos[r.id]; const n=inRoom(r.id).length;

  // GET /user/analytics returns hard-coded dummy values in the backend; same here
  const A=[['Took over',2],['Seen',15],['Hand overs',94],['Duration (min)',120],['"Lorem" rate %',41],['Steps','6,234']];
  return `${nav('Analytics',{back:'d-back'})}<div class="body"><div class="kv">${A.map(([l,n])=>`<div class="tile"><small>${l}</small><b>${n}</b></div>`).join('')}</div>
    <div class="note">Placeholder numbers: the backend returns fixed dummy values for these six tiles (the "lorem rate" label gives it away).</div></div>`;
}

/* triage edit (TriageDetailVC) */
function renderTriage(t){
  const p=patientByNric(t.n); const f=t.f;
  const allowed = f.priority? AREA_RULES[f.priority]:null;
  return `${nav('Triage — '+esc(fullName(p)),{back:'d-back'})}<div class="body">
    <label class="f">Complaint</label><select data-tf="complaint"><option value="">Select</option>${LOOKUP.complaints.map(c=>`<option value="${c.id}" ${f.complaint===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
    <label class="f">Duration</label><div class="row"><input type="number" min="0" data-tf="durN" value="${f.durN}" placeholder="0"><select data-tf="durU">${LOOKUP.durationUnits.map(u=>`<option ${f.durU===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <label class="f">Priority category</label><div class="chips">${LOOKUP.priorities.map(x=>`<button class="chip p${x.id} ${f.priority===x.id?'on':''}" data-a="d-pri" data-id="${x.id}">${x.name}</button>`).join('')}</div>
    <label class="f">Area (allowed areas depend on priority)</label>
    ${f.priority?`<div class="chips">${LOOKUP.areas.map(a=>`<button class="chip ${f.area===a.id?'on':''}" data-a="d-tarea" data-id="${a.id}" ${allowed.includes(a.id)?'':'disabled'}>${a.name}</button>`).join('')}</div>`:'<div class="hint">Pick a priority first.</div>'}
    <label class="f">Comments</label><textarea data-tf="comment">${esc(f.comment)}</textarea></div>
    <div class="foot"><button class="btn" data-a="d-savetriage" data-n="${esc(p.nric)}">Submit</button></div>`;
}

/* dispose (DisposeVC) */
// illustrative only: the real app shows estimated_cost / length_of_stay_days saved on the diagnosis
function estimate(f){ return {cost:1200+(f.discipline?600:0)+({A1:3000,B1:1500,B2:800,C:300}[f.bedClass]||0), days:1+(f.bedClass==='A1'?0:2)+(f.discipline?1:0)}; }
function renderDispose(t){
  const p=patientByNric(t.n); const f=t.f; const admit=f.mode==='admit';
  const pillBtn=(k,label,val)=>`<div class="card" style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><div style="flex:1"><div class="sub">${label}</div>${esc(val)||'<span class="sub">Not set</span>'}</div><button class="pen" data-a="d-text" data-k="${k}" data-l="${label}">${val?'Edit':'+ Add'}</button></div>`;
  const {cost,days} = admit? estimate(f):{cost:0,days:0};
  return `${nav('Dispose — '+esc(fullName(p)),{back:'d-back'})}<div class="body">
    <div class="sw"><button class="${admit?'on':''}" data-a="d-mode" data-m="admit">Admit</button><button class="${admit?'':'on'}" data-a="d-mode" data-m="discharge">Discharge</button></div>
    <label class="f">Diagnosis</label><textarea data-df="text" placeholder="Enter diagnosis">${esc(f.text)}</textarea>
    ${admit?`
      <label class="f">Admit discipline</label><select data-df="discipline"><option value="">Select</option>${LOOKUP.disciplines.map(d=>`<option ${f.discipline===d?'selected':''}>${d}</option>`).join('')}</select>
      <label class="f">Bed class</label><select data-df="bedClass"><option value="">Select</option>${LOOKUP.bedClasses.map(d=>`<option ${f.bedClass===d?'selected':''}>${d}</option>`).join('')}</select>
      <div class="kv gap"><div><small>Estimated length of stay</small><b>${days} days</b></div><div><small>Estimated total cost</small><b>$${cost.toLocaleString()}</b></div></div>
      <div class="hint">Cost / stay are illustrative; the original reads them from the saved diagnosis.</div>`
    :`
      <div class="gap"></div>${pillBtn('follow','Follow up',f.follow)}${pillBtn('medication','Medication',f.medication)}${pillBtn('leave','Medical leave',f.leave)}
      <div class="kv"><div><small>Reattendance risk</small><b>37 %</b></div><div><small>30-day mortality risk</small><b>2.7 %</b></div></div>
      <div class="hint">Risk figures are hard-coded placeholders in the backend (<code>get_disposition</code>) — same here.</div>`}
    <button class="btn sec gap" data-a="d-clear">Clear</button></div>
    <div class="foot"><button class="btn" data-a="d-savedispose" data-n="${esc(p.nric)}">Submit</button></div>`;
}

/* doctor actions */
function login(){
  DB.me={id:99,title:'Dr',first:'Fred',last:'Demo',type:null,role:null,team:null,area:null,shift:null}; save();
  D.stack=[{s:'role'}];
}
function doctorAction(a,el){
  switch(a){
  case 'd-login': {
    const u=$('#lu').value.trim(), pw=$('#lp').value;
    if(!u) return toast('Username is missing!'); if(!pw) return toast('Password is missing!');
    if(u!=='fred'||pw!=='test') return toast('Username/Password is incorrect!');
    login(); break; }
  case 'd-faceid': toast('Authentication Successful',true); login(); break;
  case 'd-logout': DB.me=null; save(); resetDoctor(); break;
  case 'd-back': pop(); break;
  case 'd-role': D.reg.type=+el.dataset.id; push({s:'coverage'}); break;
  case 'd-cov': D.reg.area=+el.dataset.id; break;
  case 'd-shift': D.reg.shift=el.dataset.s; break;
  case 'd-cov-next': if(!D.reg.area) return toast('Please select an area of coverage'); if(!D.reg.shift) return toast('Please select a shift time'); push({s:'teams'}); break;
  case 'd-newteam': D.reg.teamArea=null; D.reg.teamName=''; push({s:'newteam'}); break;
  case 'd-teamarea': D.reg.teamArea=+el.dataset.id; break;
  case 'd-createteam': { const n=(D.reg.teamName||'').trim(); if(!n) return toast('Team name is missing!'); const nid=Math.max(...DB.teams.map(x=>x.id))+1; DB.teams.push({id:nid,name:n,area:D.reg.teamArea||null}); save(); pop(); if(cur().s==='assign') cur().f.team=nid; break; }
  case 'd-jointeam': {
    const roles={1:'junior',2:'senior',3:'regular'};
    Object.assign(DB.me,{type:D.reg.type,role:roles[D.reg.type],team:+el.dataset.id,area:D.reg.area,shift:D.reg.shift});
    DB.doctors=DB.doctors.filter(d=>d.id!==99); DB.doctors.push(DB.me); DB.me.title=D.reg.type===3?'Nurse':'Dr';
    save(); D.stack=[{s:'main'}]; D.tab='patients'; break; }
  case 'd-assign': { const m=DB.me; push({s:'assign',f:{type:m.type||2,role:m.role||null,area:m.area||null,shift:m.shift||null,team:m.team||null}}); break; }
  case 'd-atype': { const f=cur().f; f.type=+el.dataset.id; if(!(LOOKUP.rolesByType[f.type]||[]).includes(f.role)) f.role=LOOKUP.rolesByType[f.type][0]; break; }
  case 'd-arole': cur().f.role=el.dataset.r; break;
  case 'd-aarea': cur().f.area=+el.dataset.id; break;
  case 'd-ashift': cur().f.shift=el.dataset.s; break;
  case 'd-ateam': cur().f.team=+el.dataset.id; break;
  case 'd-asave': {
    const f=cur().f, m=DB.me;
    if(!f.role) return toast('Please select a sub-role'); if(!f.area) return toast('Please select an area of coverage'); if(!f.shift) return toast('Please select a shift time'); if(!f.team) return toast('Please select a team');
    Object.assign(m,{type:f.type,role:f.role,area:f.area,shift:f.shift,team:f.team,title:f.type===3?'Nurse':'Dr'});
    save(); toast('Assignment updated',true); pop(); break; }
  case 'd-tab': D.tab=el.dataset.t; D.roomSel=null; break;
  case 'd-searchtoggle': D.searchOpen=!D.searchOpen; if(!D.searchOpen) D.search=''; break;
  case 'd-seg': D.seg=+el.dataset.i; break;
  case 'd-readmore': { D.boardOpen=+el.dataset.id; const b=find(DB.board,D.boardOpen); b.seen=true; save(); break; }
  case 'd-room': D.roomSel = D.roomSel===+el.dataset.id? null : +el.dataset.id; break;
  case 'd-ping': { const ps=allPatientsForView().filter(p=>p.visit.status<3); ps.forEach(p=>{ if(Math.random()<.6) p.visit.room=1+Math.floor(Math.random()*6); }); save(); toast('Beacon entries received',true); break; }
  case 'd-open': {
    const p=patientByNric(el.dataset.n);
    // PatientListVC: opening a pending patient moves them to "In Consult"
    if(p.visit.status===1){ p.visit.status=2; p.visit.attending=DB.me.id; save(); }
    push({s:'detail',n:p.nric}); break; }
  case 'd-edittriage': {
    const p=patientByNric(el.dataset.n); const tr=p.visit.triage||{};
    let unit='minutes',n=0; if(tr.dur){ for(const u of LOOKUP.durationUnits.slice().reverse()){ const s=LOOKUP.durationSecs[u]; if(tr.dur>=s && tr.dur%s===0){unit=u;n=tr.dur/s;break;} } }
    push({s:'triage',n:p.nric,f:{complaint:tr.complaint||null,durN:n||'',durU:unit,priority:tr.priority||null,area:tr.area||null,comment:tr.comment||''}}); break; }
  case 'd-pri': { const t=cur(); t.f.priority=+el.dataset.id; if(t.f.area && !AREA_RULES[t.f.priority].includes(t.f.area)) t.f.area=null; break; }
  case 'd-tarea': cur().f.area=+el.dataset.id; break;
  case 'd-savetriage': {
    const t=cur(), f=t.f, p=patientByNric(el.dataset.n);
    if(!f.complaint) return toast('Please select a complaint'); if(!f.priority) return toast('Please select a priority'); if(!f.area) return toast('Please select an area');
    const prev=p.visit.triage||{};
    p.visit.triage=Object.assign({mode:'Walk-in',flags:''},prev,{complaint:f.complaint,priority:f.priority,area:f.area,dur:(parseFloat(f.durN)||0)*LOOKUP.durationSecs[f.durU],comment:f.comment});
    save(); toast('Triage saved',true); pop(); break; }
  case 'd-dispose': {
    const p=patientByNric(el.dataset.n); const dg=p.visit.diagnosis;
    push({s:'dispose',n:p.nric,f:{mode:dg&&dg.status===2?'admit':'discharge',text:dg?dg.text:'',discipline:dg?dg.discipline||'':'',bedClass:dg?dg.bedClass||'':'',follow:dg?dg.follow:'',medication:dg?dg.medication:'',leave:dg?dg.leave:''}}); break; }
  case 'd-mode': cur().f.mode=el.dataset.m; break;
  case 'd-clear': Object.assign(cur().f,{text:'',discipline:'',bedClass:'',follow:'',medication:'',leave:''}); break;
  case 'd-text': {
    const k=el.dataset.k, l=el.dataset.l;
    const m=openModal(`<div class="name">${esc(l)}</div><input type="text" id="mt" class="gap" value="${esc(cur().f[k])}"><div class="row gap"><button class="btn sec" data-a="d-modalclose">Close</button><button class="btn" data-a="d-modalok" data-k="${k}">OK</button></div>`,true);
    $('#mt',m).focus(); return; }
  case 'd-modalclose': closeModal(); return;
  case 'd-modalok': cur().f[el.dataset.k]=$('#mt').value.trim(); closeModal(); break;
  case 'd-savedispose': {
    const f=cur().f, p=patientByNric(el.dataset.n), admit=f.mode==='admit';
    if(!f.text.trim()) return toast('Diagnosis is missing!');
    if(admit){ if(!f.discipline) return toast('Select an admit discipline'); if(!f.bedClass) return toast('Select a bed class'); }
    else { if(!f.follow) return toast('Follow up is missing!'); if(!f.medication) return toast('Medication is missing!'); if(!f.leave) return toast('Medical leave is missing!'); }
    const {cost,days}=admit?estimate(f):{cost:0,days:0};
    p.visit.diagnosis={text:f.text.trim(),status:admit?2:3,follow:f.follow,medication:f.medication,leave:f.leave,discipline:admit?f.discipline:null,bedClass:admit?f.bedClass:null,cost,days};
    p.visit.status=3; save(); toast(admit?'Admitted':'Discharged',true);
    D.stack=[{s:'main'}]; D.tab='patients'; break; }
  case 'd-dtab': cur().tab=el.dataset.t; break;
  case 'd-cacc': { const t=cur(); t.open=t.open||{}; t.open[el.dataset.k]=!t.open[el.dataset.k]; break; }
  case 'd-cedit': {
    const t=cur(), k=el.dataset.k, p=patientByNric(el.dataset.n);
    if(t.edit===k){ const ta=$('#ce'); const val=ta?ta.value.trim():''; if(val){ p.visit.consult[k]=val; save(); } else toast('Nothing to save'); t.edit=null; }
    else { t.edit=k; t.open=t.open||{}; t.open[k]=true; }
    break; }
  case 'd-tasks': push({s:'tasks',n:el.dataset.n}); break;
  case 'd-newtask': push({s:'newtask',n:el.dataset.n,f:{subject:'',message:'',rec:[]}}); break;
  case 'd-rec': { const f=cur().f, id=+el.dataset.id; f.rec=f.rec.includes(id)?f.rec.filter(x=>x!==id):f.rec.concat(id); break; }
  case 'd-savetask': {
    const f=cur().f, p=patientByNric(el.dataset.n);
    if(!f.rec.length) return toast('Select at least one recipient'); if(!f.subject.trim()) return toast('Subject is missing!'); if(!f.message.trim()) return toast('Message is missing!');
    const at=Date.now();
    p.visit.tasks.push({id:at%1000000,subject:f.subject.trim(),message:f.message.trim(),status:'Unfinished',creator:DB.me.id,recipients:f.rec.slice(),created:at,messages:[{from:DB.me.id,text:f.message.trim(),at}]});
    save(); toast('Task sent',true); pop(); break; }
  case 'd-task': push({s:'task',n:el.dataset.n,id:+el.dataset.id}); break;
  case 'd-complete': { const k=patientByNric(el.dataset.n).visit.tasks.find(x=>x.id===+el.dataset.id); if(k.status==='Completed') return; k.status='Completed'; save(); break; }
  case 'd-sendmsg': {
    const v=$('#tmsg').value.trim(); if(!v) return;
    const k=patientByNric(el.dataset.n).visit.tasks.find(x=>x.id===+el.dataset.id);
    // as in NewTaskVC: a reply from someone other than the creator moves New/Unfinished -> Pending
    if((k.status==='New'||k.status==='Unfinished') && k.creator!==DB.me.id) k.status='Pending';
    k.messages.push({from:DB.me.id,text:v,at:Date.now()}); save(); break; }
  case 'd-situation': push({s:'shell',title:'Situation'}); break;
  case 'd-status': push({s:'shell',title:'Status'}); break;
  case 'd-settings': push({s:'shell',title:'Settings'}); break;
  case 'd-screening': push({s:'screening'}); break;
  case 'd-mtriage': push({s:'mtriage',sel:null}); break;
  case 'd-trsel': cur().sel=el.dataset.n; break;
  case 'd-analytics': push({s:'analytics'}); break;
  case 'd-logout-ask':
    openModal(`<div class="name">Are you sure you want to log out?</div><div class="row gap"><button class="btn sec" data-a="d-modalclose">No</button><button class="btn" data-a="d-logout">Yes</button></div>`,true); return;
  }
  renderDoctor();
}
function bindDoctorInputs(e){
  const t=e.target, s=cur();
  if(t.id==='sq'){ D.search=t.value; const pos=t.selectionStart; renderDoctor(); const n=$('#sq'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} return; }
  if(t.id==='tn'){ D.reg.teamName=t.value; return; }
  if(t.dataset.nf){ s.f[t.dataset.nf]=t.value; return; }
  if(t.dataset.tf){ const k=t.dataset.tf; s.f[k]= (k==='complaint')?(+t.value||null):t.value; }
  if(t.dataset.df){ s.f[t.dataset.df]=t.value; if(t.dataset.df==='bedClass'||t.dataset.df==='discipline') renderDoctor(); }
}

/* ============================================================
   Wiring
   ============================================================ */
let app = (()=>{ try{ return localStorage.getItem(LS_KEY+':app')||'patient'; }catch(e){ return 'patient'; } })();
function setApp(a){
  app=a; try{ localStorage.setItem(LS_KEY+':app',a); }catch(e){}
  document.querySelectorAll('#appSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.app===a));
  render();
}
function render(){ app==='patient'?renderPatient():renderDoctor(); }

document.addEventListener('click',e=>{
  const sw=e.target.closest('#appSwitch button'); if(sw) return setApp(sw.dataset.app);
  const el=e.target.closest('[data-a]'); if(!el||!$('#device').contains(el)) return;
  const a=el.dataset.a;
  if(a==='d-modalclose'||a==='d-modalok') return doctorAction(a,el);
  if(a.startsWith('p-')) patientAction(a,el); else doctorAction(a,el);
  // closing modal after OK handled in doctorAction re-render
});
document.addEventListener('input',e=>{ if(!$('#device').contains(e.target)) return; app==='patient'?bindPatientInputs(e):bindDoctorInputs(e); });
document.addEventListener('change',e=>{ if(!$('#device').contains(e.target)) return; app==='patient'?bindPatientInputs(e):bindDoctorInputs(e); });
$('#assisted').addEventListener('change',()=>{ resetPatient(); if(app==='patient') renderPatient(); });
$('#resetBtn').addEventListener('click',()=>{ store.clear(); DB=seed(); resetPatient(); resetDoctor(); render(); toast('Mock data reset',true); });
setApp(app);
</script>
</body>
</html>
